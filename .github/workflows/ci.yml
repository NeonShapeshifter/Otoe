name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src examples tests
      - name: Test
        run: pytest -q
      - name: Smoke optional Pillow native text
        run: |
          python -m pip install -e ".[native-text]"
          python -m otoe render examples.quickstart:app --out /tmp/otoe-pillow.png --native --native-text pillow
          test -s /tmp/otoe-pillow.png
          pytest -q tests/test_cli.py tests/test_native_renderer_backend.py -k "pillow_native_text or profile_pillow or pillow"
      - name: Install release tooling
        run: python -m pip install build twine "setuptools>=68" wheel
      - name: Build package
        run: python -m build
      - name: Check package metadata
        run: python -m twine check dist/*
      - name: Smoke installed wheel
        run: OTOE_SMOKE_NO_BUILD_ISOLATION=1 bash scripts/wheel_smoke.sh
