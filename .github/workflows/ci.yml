name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install constrained build tooling
        run: python -m pip install --constraint requirements/ci-constraints.txt build markdown-it-py packaging setuptools twine wheel
      - name: Install project and test dependencies
        run: python -m pip install --no-build-isolation --constraint requirements/ci-constraints.txt -e ".[dev,native-text]"
      - name: Check installed dependencies
        run: python -m pip check
      - name: Portable core docs
        run: python scripts/update_portable_core_docs.py --check
      - name: Compile
        run: python -m compileall -q src examples tests
      - name: Ruff
        run: python -m ruff check src tests examples scripts
      - name: Mypy
        run: python -m mypy --strict src/otoe
      - name: Mypy release gates
        run: python -m mypy --strict scripts/cold_start_evidence.py scripts/runtime_soak.py scripts/verify_release_artifacts.py scripts/verify_release_checks.py
      - name: Stub/runtime parity
        run: python -m mypy.stubtest otoe --allowlist tests/stubtest_allowlist.txt
      - name: Test
        run: python -m pytest -q --cov=otoe --cov-report=term-missing --cov-fail-under=82
      - name: Smoke optional Pillow native text
        run: |
          python -m otoe render examples.quickstart:app --out /tmp/otoe-pillow.png --native --native-text pillow
          test -s /tmp/otoe-pillow.png
          python -m pytest -q tests/test_cli_render.py tests/test_native_text_build.py tests/test_native_renderer_backend.py -k "pillow_native_text or profile_pillow or pillow"
      - name: Build package
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          python -m build --no-isolation
          python scripts/normalize_sdist.py --epoch "$SOURCE_DATE_EPOCH" dist/*.tar.gz
      - name: Verify exact release artifact identity
        run: python -I scripts/verify_release_artifacts.py --dist-dir dist --project pyproject.toml
      - name: Check package metadata
        run: python -m twine check dist/*.whl dist/*.tar.gz
      - name: Smoke source distribution
        run: bash scripts/sdist_smoke.sh "$(find dist -maxdepth 1 -name 'otoe-*.tar.gz' -print -quit)"
      - name: Smoke installed wheel
        env:
          OTOE_SMOKE_WORKDIR: ${{ runner.temp }}/otoe-cold-start
        run: bash scripts/wheel_smoke.sh "$(find dist -maxdepth 1 -name 'otoe-*.whl' -print -quit)"
      - name: Record cold-start evidence digest
        if: always()
        env:
          COLD_START_EVIDENCE: ${{ runner.temp }}/otoe-cold-start/cold-start-evidence.json
        run: |
          if [[ ! -f "$COLD_START_EVIDENCE" ]]; then
            echo "cold-start evidence was not produced" >&2
            exit 1
          fi
          python -I - "$COLD_START_EVIDENCE" "$GITHUB_STEP_SUMMARY" <<'PY'
          from hashlib import sha256
          import json
          from pathlib import Path
          import sys

          evidence = Path(sys.argv[1])
          payload = json.loads(evidence.read_text(encoding="utf-8"))
          evidence_digest = sha256(evidence.read_bytes()).hexdigest()
          wheel_digest = payload["wheel"]["sha256"]
          print(f"cold-start evidence sha256 {evidence_digest}")
          print(f"cold-start wheel sha256 {wheel_digest}")
          with Path(sys.argv[2]).open("a", encoding="utf-8") as summary:
              summary.write("## Cold-start evidence\n\n")
              summary.write(f"- Evidence SHA-256: `{evidence_digest}`\n")
              summary.write(f"- Wheel SHA-256: `{wheel_digest}`\n")
          PY
      - name: Upload cold-start evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: cold-start-evidence-py${{ matrix.python-version }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/otoe-cold-start/cold-start-evidence.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Reproducible distributions
        if: matrix.python-version == '3.12'
        run: PYTHON=python scripts/reproducible_build_check.sh dist
      - name: Performance regression budgets
        if: matrix.python-version == '3.12'
        run: python scripts/bench_smoke.py --check
