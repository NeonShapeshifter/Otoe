name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install constrained build tooling
        run: python -m pip install --constraint requirements/ci-constraints.txt build setuptools twine wheel
      - name: Install project and test dependencies
        run: python -m pip install --no-build-isolation --constraint requirements/ci-constraints.txt -e ".[dev,native-text]"
      - name: Check installed dependencies
        run: python -m pip check
      - name: Portable core docs
        run: python scripts/update_portable_core_docs.py --check
      - name: Compile
        run: python -m compileall -q src examples tests
      - name: Ruff
        run: python -m ruff check src tests examples scripts
      - name: Mypy
        run: python -m mypy --strict src/otoe
      - name: Stub/runtime parity
        run: python -m mypy.stubtest otoe --allowlist tests/stubtest_allowlist.txt
      - name: Test
        run: python -m pytest -q --cov=otoe --cov-report=term-missing --cov-fail-under=82
      - name: Smoke optional Pillow native text
        run: |
          python -m otoe render examples.quickstart:app --out /tmp/otoe-pillow.png --native --native-text pillow
          test -s /tmp/otoe-pillow.png
          python -m pytest -q tests/test_cli_render.py tests/test_native_text_build.py tests/test_native_renderer_backend.py -k "pillow_native_text or profile_pillow or pillow"
      - name: Build package
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          python -m build --no-isolation
          python scripts/normalize_sdist.py --epoch "$SOURCE_DATE_EPOCH" dist/*.tar.gz
      - name: Check package metadata
        run: python -m twine check dist/*.whl dist/*.tar.gz
      - name: Smoke source distribution
        run: bash scripts/sdist_smoke.sh "$(find dist -maxdepth 1 -name 'otoe-*.tar.gz' -print -quit)"
      - name: Smoke installed wheel
        run: bash scripts/wheel_smoke.sh "$(find dist -maxdepth 1 -name 'otoe-*.whl' -print -quit)"
      - name: Reproducible distributions
        if: matrix.python-version == '3.12'
        run: PYTHON=python scripts/reproducible_build_check.sh dist
      - name: Performance regression budgets
        if: matrix.python-version == '3.12'
        run: python scripts/bench_smoke.py --check
