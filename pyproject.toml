[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "otoe"
version = "0.1.7"
description = "Experimental Python UI runtime with reactive components and live previews."
requires-python = ">=3.11"
readme = "README.md"
authors = [
    {name = "Ale"}
]
license = "MIT"
keywords = ["ui", "desktop", "reactive", "components", "python"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: User Interfaces",
]

[project.urls]
Homepage = "https://github.com/NeonShapeshifter/Otoe"
Repository = "https://github.com/NeonShapeshifter/Otoe"
Issues = "https://github.com/NeonShapeshifter/Otoe/issues"
Changelog = "https://github.com/NeonShapeshifter/Otoe/blob/main/CHANGELOG.md"

[project.scripts]
otoe = "otoe.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10"]
release = ["build>=1.2", "twine>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
otoe = ["py.typed", "*.pyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"
