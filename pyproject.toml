[build-system]
requires = ["setuptools>=77", "wheel>=0.43"]
build-backend = "setuptools.build_meta"

[project]
name = "otoe"
version = "0.2.0"
description = "Experimental Python UI runtime with reactive components and live previews."
requires-python = ">=3.11"
readme = "README.md"
authors = [
    {name = "Ale"}
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["ui", "desktop", "reactive", "components", "python"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: User Interfaces",
]

[project.urls]
Homepage = "https://github.com/NeonShapeshifter/Otoe"
Repository = "https://github.com/NeonShapeshifter/Otoe"
Issues = "https://github.com/NeonShapeshifter/Otoe/issues"
Changelog = "https://github.com/NeonShapeshifter/Otoe/blob/main/CHANGELOG.md"

[project.scripts]
otoe = "otoe.cli:main"

[project.optional-dependencies]
dev = [
    "hypothesis>=6.156.6",
    "pytest>=8",
    "mypy>=1.10",
    "ruff>=0.5",
    "pytest-cov>=5",
]
native-text = ["Pillow>=10"]
release = [
    "build>=1.2",
    "setuptools>=77",
    "twine>=6",
    "wheel>=0.43",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
otoe = ["py.typed", "*.pyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    "build",
    "dist",
    "dist-wheel-smoke",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = [
    "E501",
    "E731",
]

[tool.ruff.lint.per-file-ignores]
"scripts/bench_smoke.py" = ["E402"]
"scripts/update_portable_core_docs.py" = ["E402"]

[tool.coverage.run]
branch = true
source = ["otoe"]

[tool.coverage.report]
fail_under = 82
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
